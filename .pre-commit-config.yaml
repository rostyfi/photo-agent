repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Mypy runs as a blocking gate: type errors will prevent pushes.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'mypy --config-file=pyproject.toml src plugins main.py app.py'
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: pytest-cov
        name: pytest with coverage
        entry: python3 -m pytest --cov=src --cov=plugins --cov-report=term-missing tests/
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
